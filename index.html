        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What time does the US Stock Market (NYSE & NASDAQ) open and close?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The New York Stock Exchange (NYSE) and NASDAQ open at 9:30 AM EST and close at 4:00 PM EST, Monday through Friday."

          },
          {
            "@type": "Question",
            "name": "How does the live stock market countdown work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our clock calculates the exact time remaining until the next opening or closing bell across New York, London, Dubai, and Tokyo exchanges, automatically accounting for weekends."
            }
          }
        ]
      }
    ]
  }
  </script>

  <style>
    @keyframes flashGreen { 0% { background-color: rgba(16, 185, 129, 0.35); border-color: rgba(16, 185, 129, 0.8); } 100% { background-color: transparent; } }
    @keyframes flashRed { 0% { background-color: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.8); } 100% { background-color: transparent; } }
    .flash-up { animation: flashGreen 0.8s ease-out; }
    .flash-down { animation: flashRed 0.8s ease-out; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
